<!-- RxJS implementation begins-->
<div class="search-container">
  <input
    class="search-input"
    [formControl]="searchControl"
    placeholder="Search Users ..."
  />
  @if (filteredUsers$ | async; as users) {
    @if (users.length === 0) {
      <p>No users found.</p>
    } @else {
      <ul class="user-list">
        @for (user of users; track user.id) {
          <li class="user">{{ user.name }}</li>
        }
      </ul>
    }
  }
</div>
<!-- RxJS implementation ends-->
